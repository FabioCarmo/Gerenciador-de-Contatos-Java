spring.application.name=contatos

# URL de Conexão (Porta padrão do SQL Server é 1433)
# O encrypt=true e trustServerCertificate=true evitam erros de certificado SSL comuns no ambiente local
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Contatos;encrypt=true;trustServerCertificate=true;
spring.datasource.username=admindb
spring.datasource.password=admin
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
